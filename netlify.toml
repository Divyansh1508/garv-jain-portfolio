# Netlify Production Configuration for Garv Jain Official Luxury Portfolio

[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/index.html#admin"
  status = 302
  force = true

[[redirects]]
  from = "/admin/"
  to = "/index.html#admin"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/index.html#admin"
  status = 302
  force = true

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
